# house hooks --no-decisions --bans . --bans crates/house --bans crates/line-ceiling --bans crates/responsa
# Written by `house hooks` (eidetic, crates/house); `house hooks --check` fails when this file drifts from it.
# `house` is on the PATH: cargo install --git https://github.com/merely-made/eidetic house
fail_fast: true
default_install_hook_types: [pre-commit, post-commit, pre-push]
# Hooks without stages run at pre-commit only, so the notes push inside
# `house resolved push` reruns nothing but that hook.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: line-ceiling
        name: line ceiling
        entry: house line-ceiling
        language: system
        types: [text]
        always_run: true
      - id: clippy
        name: clippy
        entry: cargo clippy --all-targets
        language: system
        files: '(^|/)(Cargo\.toml|rust-toolchain\.toml|[^/]+\.rs)$'
        pass_filenames: false
      - id: dependency-bans
        name: dependency bans
        entry: cargo deny --workspace --all-features check -D unmatched-skip bans
        language: system
        pass_filenames: false
        always_run: true
      - id: dependency-bans-crates-house
        name: dependency bans crates/house
        entry: cargo deny --manifest-path crates/house/Cargo.toml --workspace --all-features --config crates/house/deny.toml check -D unmatched-skip bans
        language: system
        pass_filenames: false
        always_run: true
      - id: dependency-bans-crates-line-ceiling
        name: dependency bans crates/line-ceiling
        entry: cargo deny --manifest-path crates/line-ceiling/Cargo.toml --workspace --all-features --config crates/line-ceiling/deny.toml check -D unmatched-skip bans
        language: system
        pass_filenames: false
        always_run: true
      - id: dependency-bans-crates-responsa
        name: dependency bans crates/responsa
        entry: cargo deny --manifest-path crates/responsa/Cargo.toml --workspace --all-features --config crates/responsa/deny.toml check -D unmatched-skip bans
        language: system
        pass_filenames: false
        always_run: true
      # No Cargo.lock is tracked; what cargo resolved rides on each commit as a
      # git note under refs/notes/resolved (`house resolved show <commit>`).
      - id: record-resolved
        name: record resolved versions
        entry: house resolved record
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]
      - id: push-resolved
        name: push resolved versions
        entry: house resolved push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
