fail_fast: true
repos:
  - repo: local
    hooks:
      - id: line-ceiling
        name: line ceiling
        entry: line-ceiling
        language: rust
        types: [text]
        always_run: true
        additional_dependencies: ["cli:https://github.com/merely-made/eidetic:line-ceiling-v0.0.2:line-ceiling"]
      - id: clippy
        name: clippy
        entry: cargo clippy --locked --all-targets
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|[^/]+\.rs)$'
        pass_filenames: false
