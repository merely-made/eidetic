[package]
rust-version = "1.97.1"
name = "responsa"
version = "0.0.1"
repository = "https://github.com/merely-made/eidetic"
description = "Answers kept as cases and reconciled into a doctrine: manifest, register, link journal, lookup, budget and links across repositories"
readme = "README.md"
keywords = ["decisions", "documentation", "doctrine", "provenance"]
categories = ["development-tools", "command-line-utilities"]

[package.edition]
workspace = true

[package.license]
workspace = true

[dependencies]
impresa = { path = "../impresa", version = "0.0.1" }
muniment = { workspace = true, features = ["json", "directory"] }
pollster = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
serde_json = "1"
