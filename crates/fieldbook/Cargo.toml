[package]
rust-version = "1.97.1"
name = "fieldbook"
version = "0.1.0"
edition = "2024"
description = "Graph fields as portable data: field identity and extent, a scalar/vector field AST, couplings (how nodes respond to a field) and edge paths. Definitions only; evaluation lives elsewhere. Formerly the field modules of the chartulary crate."
repository = "https://github.com/merely-made/eidetic"
keywords = [
    "field",
    "graph",
    "scalar-field",
    "vector-field",
]
categories = [
    "data-structures",
]

[package.license]
workspace = true

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.uuid]
version = "1"
features = [
    "serde",
]

# Field and coupling ids (from numen, Mere engine-split D49): random ids are
# native-only; wasm hosts mint ids from a host-supplied UUID.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.uuid]
version = "1"
features = [
    "v4",
]

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.uuid]
version = "1"
features = [
    "js",
]

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
