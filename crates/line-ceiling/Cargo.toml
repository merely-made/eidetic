[package]
rust-version = "1.97.1"
name = "line-ceiling"
version = "0.0.1"
repository = "https://github.com/merely-made/eidetic"
description = "Fails source files over a line ceiling unless excluded by declared path or excepted with a reason"
readme = "README.md"
keywords = ["lint", "pre-commit", "source-size"]
categories = ["development-tools", "command-line-utilities"]
edition = "2024"
license = "MPL-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"

[lints.clippy]
all = "warn"

# Its own workspace, so a git install fetches only these dependencies and
# not every git source of eidetic's workspace (line-ceiling plan D5).
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[workspace]

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"
