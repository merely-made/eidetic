[package]
rust-version = "1.97.1"
name = "muniment"
version = "0.2.0"
edition = "2024"
description = "A portable persistence floor: host-supplied byte backends, typed mutable slots, content-addressed immutable blobs, and append-only journals. Format-agnostic and wasm-friendly."
repository = "https://github.com/merely-made/eidetic"
keywords = [
    "storage",
    "persistence",
    "content-addressed",
    "blob",
    "wasm",
]
categories = [
    "data-structures",
    "filesystem",
]

[package.license]
workspace = true

[dependencies]
async-trait = "0.1"
blake3 = "1.5"

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.postcard]
version = "1"
features = [
    "alloc",
]
optional = true

[dependencies.redb]
version = "2"
optional = true

[dependencies.zip]
version = "2"
default-features = false
features = [
    "deflate",
]
optional = true

[target."cfg(target_arch = \"wasm32\")".dependencies.futures-channel]
version = "0.3"
optional = true

[target."cfg(target_arch = \"wasm32\")".dependencies.js-sys]
version = "0.3"
optional = true

[target."cfg(target_arch = \"wasm32\")".dependencies.wasm-bindgen]
version = "0.2"
optional = true

[target."cfg(target_arch = \"wasm32\")".dependencies.web-sys]
version = "0.3"
features = [
    "DomException",
    "DomStringList",
    "Event",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "WorkerGlobalScope",
    "Window",
]
optional = true

[target."cfg(not(target_arch = \"wasm32\"))".dependencies.fjall]
version = "2"
optional = true

[features]
default = [
    "json",
]
json = [
    "dep:serde_json",
]
postcard = [
    "dep:postcard",
]
redb = [
    "dep:redb",
]
zip = [
    "dep:zip",
]
directory = []
fjall = [
    "dep:fjall",
]
indexeddb = [
    "dep:futures-channel",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:web-sys",
]

[dev-dependencies]
pollster = "0.4"
serde_json = "1"
tempfile = "3"

[dev-dependencies.postcard]
version = "1"
features = [
    "alloc",
]

[[example]]
name = "redb_cross_process_lock"
required-features = [
    "redb",
]
