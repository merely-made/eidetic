[package]
rust-version = "1.97.1"
name = "chartulary"
version = "0.3.1"
edition = "2024"
description = "The generic content-addressed container graph (aka chart). Graph<N, E> on petgraph with capability traits, default Container/Relation payloads, RDF projection (`chartulary::rdf`), and the lineage layer (`chartulary::stemma`). The substrate binds muniment's blobs and journals into an app-agnostic graph."
repository = "https://github.com/merely-made/eidetic"
keywords = [
    "graph",
    "content-addressed",
    "knowledge-graph",
    "petgraph",
]
categories = [
    "data-structures",
]

[package.license]
workspace = true

[dependencies]
serde_json = "1"

[dependencies.petgraph]
version = "0.8"
features = [
    "serde-1",
]

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.muniment]
workspace = true

[dependencies.rkyv]
version = "0.8"
features = [
    "std",
]

[dependencies.slotmap]
version = "1.0"
features = [
    "serde",
]

[dependencies.uuid]
version = "1"
features = [
    "v5",
    "serde",
]

# Field and coupling ids (from numen, D49): random ids are native-only; wasm
# hosts mint ids from a host-supplied UUID.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.uuid]
version = "1"
features = [
    "v4",
]

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.uuid]
version = "1"
features = [
    "js",
]

[dev-dependencies]
pollster = "0.4"

[dev-dependencies.muniment]
workspace = true
features = [
    "json",
]

[lints]
workspace = true
