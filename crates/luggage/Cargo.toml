[package]
rust-version = "1.97.1"
name = "luggage"
version = "0.1.0"
edition = "2021"
description = "Self-update for packaged apps: signed manifests over pluggable feeds (HTTP, directory, GitHub Releases). A fork of cargo-packager-updater carrying the Merely family's update posture."
repository = "https://github.com/merely-made/eidetic"

[package.license]
workspace = true

[features]
default = [
    "native",
]
native = [
    "dep:base64",
    "dep:blake3",
    "dep:cargo-packager-utils",
    "dep:dirs",
    "dep:flate2",
    "dep:http",
    "dep:log",
    "dep:minisign-verify",
    "dep:percent-encoding",
    "dep:reqwest",
    "dep:tar",
    "dep:tempfile",
]

[dependencies]
semver = "1"
serde_json = "1"
thiserror = "1"

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.time]
version = "0.3"
features = [
    "parsing",
    "formatting",
]

[dependencies.url]
version = "2"
features = [
    "serde",
]

[dependencies.base64]
version = "0.22"
optional = true

[dependencies.blake3]
version = "1.5"
optional = true

[dependencies.cargo-packager-utils]
version = "0.1.1"
optional = true

[dependencies.dirs]
version = "5.0"
optional = true

[dependencies.http]
version = "1"
optional = true

[dependencies.log]
version = "0.4"
optional = true

[dependencies.minisign-verify]
version = "0.2"
optional = true

[dependencies.percent-encoding]
version = "2"
optional = true

[dependencies.reqwest]
version = "0.12"
default-features = false
features = [
    "blocking",
    "json",
    "rustls-tls",
]
optional = true

[dependencies.tempfile]
version = "3.12"
optional = true

[target."cfg(target_os = \"macos\")".dependencies.flate2]
version = "1.0"
optional = true

[target."cfg(target_os = \"macos\")".dependencies.tar]
version = "0.4"
optional = true

[dev-dependencies]
minisign = "0.7"

[[bin]]
name = "luggage-manifest"
required-features = [
    "native",
]
