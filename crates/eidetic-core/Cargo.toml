[package]
rust-version = "1.97.1"
name = "eidetic"
version = "0.0.2"
repository = "https://github.com/merely-made/eidetic"
description = "Portable intake, typed retained content and memory for Mere, independent of concrete storage and network adapters."
documentation = "https://docs.rs/eidetic"
readme = "README.md"
keywords = [
    "memory",
    "storage",
    "blob",
    "browser",
    "mere",
]
categories = [
    "data-structures",
]

[package.edition]
workspace = true

[package.license]
workspace = true

[lib]
name = "eidetic"
path = "src/lib.rs"

[dependencies]
zeroize = "1"
async-trait = "0.1"
blake3 = "1.5"
serde_json = "1.0"
url = "2.5"

[dependencies.identity]
workspace = true
optional = true

[dependencies.muniment]
workspace = true
features = [
    "json",
]

[dependencies.jsonschema]
version = "0.18"
default-features = false
optional = true

[dependencies.serde]
version = "1.0"
features = [
    "derive",
]

[dependencies.chartulary]
workspace = true

[features]
default = [
    "pack-signing",
    "json-schema",
]
pack-signing = [
    "dep:identity",
]
json-schema = [
    "dep:jsonschema",
]
lineage = []

[dev-dependencies]
bytes = "1"
mockito = "1.4"
pollster = "0.4"
tempfile = "3"
chacha20poly1305 = "0.11"

[dev-dependencies.transport]
workspace = true
features = [
    "test-identity",
]

[dev-dependencies.identity]
workspace = true

[dev-dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt-multi-thread",
]

[target."cfg(not(target_arch = \"wasm32\"))".dev-dependencies.muniment]
workspace = true
features = [
    "fjall",
    "redb",
]
