[package]
rust-version = "1.97.1"
name = "eidetic"
version = "0.0.3"
repository = "https://github.com/merely-made/eidetic"
description = "Portable intake, typed retained content and memory for Mere, independent of concrete storage and network adapters."
documentation = "https://docs.rs/eidetic"
readme = "README.md"
keywords = [
    "memory",
    "storage",
    "blob",
    "browser",
    "mere",
]
categories = [
    "data-structures",
]

[package.edition]
workspace = true

[package.license]
workspace = true

[lib]
name = "eidetic"
path = "src/lib.rs"

[dependencies]
zeroize = "1"
async-trait = "0.1"
blake3 = "1.5"
serde_json = "1.0"
url = "2.5"
uuid = { version = "1", features = ["serde"] }

[dependencies.identity]
workspace = true
optional = true

[dependencies.muniment]
workspace = true
features = [
    "json",
]

[dependencies.jsonschema]
version = "0.18"
default-features = false
optional = true

[dependencies.serde]
version = "1.0"
features = [
    "derive",
]

[dependencies.chartulary]
workspace = true

[features]
default = [
    "pack-signing",
    "json-schema",
    "product",
]
pack-signing = [
    "dep:identity",
]
json-schema = [
    "dep:jsonschema",
]
lineage = [
    "browsing",
]
# The browsing-memory product half (engine-split D50). The substrate (schema,
# typed payloads, retention, seal, manifest, codicil, pack, bundle, schema_def
# and schema facets) is always compiled; a substrate-only consumer sets
# `default-features = false`. Features that name another feature need it.
product = [
    "browsing",
    "capture",
    "clip_profile",
    "content_store",
    "deleted",
    "image_content",
    "import",
    "memory",
    "models",
    "records",
]
browsing = []
models = []
import = [
    "browsing",
]
records = [
    "models",
]
capture = [
    "browsing",
    "models",
    "records",
]
content_store = []
memory = [
    "content_store",
    "deleted",
]
deleted = []
clip_profile = []
image_content = []

[dev-dependencies]
pollster = "0.4"
uuid = { version = "1", features = ["serde", "v4"] }
tempfile = "3"
chacha20poly1305 = "0.11"

[dev-dependencies.identity]
workspace = true

[dev-dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt-multi-thread",
]

[target."cfg(not(target_arch = \"wasm32\"))".dev-dependencies.muniment]
workspace = true
features = [
    "directory",
    "fjall",
    "json",
    "redb",
]

[[test]]
name = "capture_faults"
required-features = ["capture"]

[[test]]
name = "capture_golden"
required-features = ["capture"]

[[test]]
name = "capture_sealed"
required-features = ["capture"]

[[test]]
name = "model_free_records"
required-features = ["records"]

[lints]
workspace = true
