[package]
rust-version = "1.97.1"
name = "eidetic"
version = "0.0.3"
repository = "https://github.com/merely-made/eidetic"
description = "Portable intake, typed retained content and memory for Mere, independent of concrete storage and network adapters."
documentation = "https://docs.rs/eidetic"
readme = "README.md"
keywords = [
    "memory",
    "storage",
    "blob",
    "browser",
    "mere",
]
categories = [
    "data-structures",
]

[package.edition]
workspace = true

[package.license]
workspace = true

[lib]
name = "eidetic"
path = "src/lib.rs"

[dependencies]
zeroize = "1"
async-trait = "0.1"
blake3 = "1.5"
serde_json = "1.0"
url = "2.5"
uuid = { version = "1", features = ["serde"] }
# The `mere.pack/2` header (declared-lens L1): RFC 8949 CBOR, SHA-256 beside
# BLAKE3 (D22), RFC 3987 IRIs, SemVer 2.0.0 and SPDX expressions. oxiri 0.3,
# the line Mere's Oxigraph fork (mark-ik/oxigraph, engine-split D155) holds.
ciborium = "0.2.2"
sha2 = { version = "0.11.1", default-features = false }
oxiri = "0.3.1"
semver = "1.0.28"
spdx = "0.13.6"
# The pack envelope's COSE_Sign1 (RFC 9052, declared-lens D6) and its
# base64url binding; `kid` is a did:key read by insigne.
coset = { version = "0.4.2", optional = true }
base64 = { version = "0.23.1", optional = true }
# The authored form's compiler (declared-lens D13): TOML 1.0, off the run-time
# path; a consumer takes it at build time.
toml = { version = "1", optional = true }

[dependencies.identity]
workspace = true
optional = true

[dependencies.insigne]
workspace = true
optional = true

[dependencies.muniment]
workspace = true
features = [
    "json",
]

[dependencies.jsonschema]
version = "0.61"
default-features = false
optional = true

[dependencies.serde]
version = "1.0"
features = [
    "derive",
]

[dependencies.portolan]
workspace = true

[dependencies.hodograph]
workspace = true

[features]
default = [
    "pack-signing",
    "json-schema",
    "product",
]
pack-signing = [
    "dep:identity",
    "dep:insigne",
    "dep:coset",
    "dep:base64",
]
json-schema = [
    "dep:jsonschema",
]
pack-authoring = [
    "dep:toml",
]
lineage = [
    "browsing",
]
# The browsing-memory product half (engine-split D50). The substrate (schema,
# typed payloads, retention, seal, manifest, codicil, pack, bundle, schema_def
# and schema facets) is always compiled; a substrate-only consumer sets
# `default-features = false`. Features that name another feature need it.
product = [
    "browsing",
    "capture",
    "clip_profile",
    "content_store",
    "deleted",
    "image_content",
    "import",
    "kept_text",
    "memory",
    "models",
    "records",
]
browsing = []
models = []
import = [
    "browsing",
]
records = [
    "models",
]
capture = [
    "browsing",
    "models",
    "records",
]
content_store = []
# Page text the person chose to keep, over PageTextStore (engine-split D71).
kept_text = [
    "browsing",
]
memory = [
    "content_store",
    "deleted",
]
deleted = []
clip_profile = []
image_content = []

[dev-dependencies]
pollster = "0.4"
# Validates the `mere.pack/2` fixtures against the header's CDDL (RFC 8610).
cddl = { version = "0.10.7", default-features = false, features = ["std", "cbor", "json", "ast-span", "ast-comments", "ast-parent", "additional-controls"] }
uuid = { version = "1", features = ["serde", "v4"] }
tempfile = "3"
chacha20poly1305 = "0.11"
# Order-independence of the authored compiler (declared-lens §3.1).
proptest = "1.11"

[dev-dependencies.identity]
workspace = true

[dev-dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt-multi-thread",
]

[target."cfg(not(target_arch = \"wasm32\"))".dev-dependencies.muniment]
workspace = true
features = [
    "directory",
    "fjall",
    "json",
    "redb",
]

[[test]]
name = "capture_faults"
required-features = ["capture"]

[[test]]
name = "capture_golden"
required-features = ["capture"]

[[test]]
name = "capture_sealed"
required-features = ["capture"]

[[test]]
name = "model_free_records"
required-features = ["records"]

[lints]
workspace = true
