[package]
rust-version = "1.97.1"
name = "eidetic-search"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Lexical and hybrid search over Eidetic browsing traces: in-tree BM25, prefix candidates, reports and ranking fusion."

[lib]
name = "eidetic_search"
path = "src/lib.rs"

[dependencies]
eidetic = { workspace = true }
# The only engine dependency: versioned UAX #29 word segmentation from
# Genet (see `src/tokenize.rs`). The scorer itself is
# in-tree — no mmap, no threads, no C, so the crate reaches wasm browser backends.
genet-text = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
muniment = { workspace = true, features = ["fjall"] }
pollster = "0.4"
async-trait = "0.1"
tempfile = "3"

[lints]
workspace = true
