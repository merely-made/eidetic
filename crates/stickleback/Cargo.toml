[package]
rust-version = "1.97.1"
name = "stickleback"
version = "0.1.1"
repository = "https://github.com/merely-made/eidetic"
description = "A shared replicated-space runtime for signed peer domains: joined p2panda spaces and their drain, policy-before-insert operation processing, muniment-backed storage, retention checkpoints, and native drop carriage. The domain supplies its own grammar, addressing, and authorization."
readme = "README.md"
keywords = [
    "p2p",
    "replication",
    "local-first",
    "sync",
]
categories = [
    "network-programming",
    "database",
]

[package.edition]
workspace = true

[package.license]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["net"]
# The peer-networking half: joined and synced spaces, the muniment address book
# for p2panda-net, and the group-key lane's `join`/`publish`. It is the only
# thing that links p2panda-net, and so iroh and QUIC. On by default so existing
# consumers build unchanged; a build that never joins a peer space turns the
# default off.
net = ["dep:p2panda-net", "dep:p2panda-sync", "dep:tokio-stream"]

[dependencies]
p2panda-core = "0.7.0"
p2panda-sync = { version = "0.7.0", optional = true }
futures-util = "0.3"
hex = "0.4"
blake3 = "1.5"
serde_bytes = "0.11"
tokio-stream = { version = "0.1", optional = true }
thiserror = "1"

[dependencies.insigne]
workspace = true
features = [
    "verify",
]

[dependencies.identity]
workspace = true

[dependencies.muniment]
workspace = true
features = [
    "json",
]

[dependencies.p2panda-encryption]
version = "0.7.0"
features = [
    "data_scheme",
    "message_scheme",
]

[dependencies.p2panda-net]
package = "mere-p2panda-net"
version = "=0.7.5"
optional = true
default-features = false
features = [
    "address_book",
    "iroh_endpoint",
    "iroh_mdns",
    "discovery",
    "gossip",
    "sync",
]

[dependencies.p2panda-store]
version = "0.7.0"
default-features = false

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.proofs]
workspace = true

[dependencies.tokio]
version = "1"
features = [
    "io-util",
    "rt",
    "sync",
    "time",
]

[dev-dependencies]
serde_json = "1"
pollster = "0.4"
tempfile = "3"

[dev-dependencies.p2panda-stream]
version = "0.7.0"
default-features = false
features = [
    "log_prune",
]
