[package]
rust-version = "1.97.1"
name = "stickleback"
version = "0.2.0"
repository = "https://github.com/merely-made/eidetic"
description = "Validated signed-operation storage, causal processing, group encryption, retention and native drops. Domains supply grammar and authorization; Murm supplies live network sessions."
readme = "README.md"
keywords = [
    "p2p",
    "replication",
    "local-first",
    "sync",
]
categories = [
    "network-programming",
    "database",
]

[package.edition]
workspace = true

[package.license]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
p2panda-core = { package = "p2mere-core", version = "0.9" }
futures-util = "0.3"
hex = "0.4"
blake3 = "1.5"
cbor-core = "0.10"
serde_bytes = "0.11"
serde_json = "1"
thiserror = "1"

[dependencies.insigne]
workspace = true
features = [
    "verify",
]

[dependencies.identity]
workspace = true

[dependencies.muniment]
workspace = true
features = [
    "json",
]

[dependencies.p2panda-encryption]
package = "p2mere-encryption"
version = "0.9"
features = [
    "data_scheme",
    "message_scheme",
    "test_utils",
]

[dependencies.p2panda-store]
package = "p2mere-store"
version = "0.9"
default-features = false

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.proofs]
workspace = true

[dependencies.tokio]
version = "1"
features = [
    "io-util",
    "rt",
    "sync",
    "time",
]

[dev-dependencies]
pollster = "0.4"
tempfile = "3"

[dev-dependencies.p2panda-stream]
package = "p2mere-stream"
version = "0.9"
default-features = false
features = [
    "log_prune",
]

[lints]
workspace = true
