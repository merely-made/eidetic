# Workspace toolchain: the current stable release. The floor is each crate's
# rust-version; no release is pinned here, so a new stable needs no edit and the
# hook tools build with the same compiler wherever they are installed from.
# The wasm32-wasip2 target is for the document-core guest crates (built per-crate).
[toolchain]
channel = "stable"
# wasm32-unknown-unknown carries the browser half of the WebRTC carrier
# (Murm native/crates/webrtc-carrier); its C0 receipt is a dual-target build, which
# only reproduces on a fresh clone if the target is declared here.
targets = ["wasm32-wasip2", "wasm32-unknown-unknown"]
