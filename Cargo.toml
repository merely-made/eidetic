[workspace]
resolver = "2"
members = [
    "crates/muniment",
    "crates/chartulary",
    "crates/eidetic-core",
    "crates/eidetic-search",
    "crates/hagiograph",
    "crates/stickleback",
    "crates/luggage",
    "crates/proofs",
    "crates/servitor",
    "crates/impresa",
    "crates/responsa",
]

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/eidetic"
authors = [
    "Mark AB (markik)",
]

[workspace.dependencies.muniment]
version = "0.2.0"
path = "crates/muniment"
default-features = false

[workspace.dependencies.identity]
package = "personae"
version = "0.3.0"
git = "https://github.com/merely-made/dramatis.git"
branch = "main"

[workspace.dependencies.chartulary]
version = "0.2.0"
path = "crates/chartulary"

[workspace.dependencies.eidetic]
version = "0.0.2"
path = "crates/eidetic-core"
default-features = false

[workspace.dependencies.genet-text]
version = "0.1.0"
git = "https://github.com/merely-made/genet.git"
# Match the existing family source identity; Cargo.lock fixes the revision.
branch = "main"

[workspace.dependencies.esp]
version = "0.1.0"
git = "https://github.com/merely-made/esp.git"
rev = "bd0468c5c44c0b098494d30b3cfd0aa283cecf48"
default-features = false

[workspace.dependencies.transport]
package = "mere-transport"
version = "0.0.2"
git = "https://github.com/merely-made/murm.git"
branch = "main"

[workspace.dependencies.serde]
version = "1"
features = [
    "derive",
]

[workspace.dependencies.insigne]
version = "0.0.2"
git = "https://github.com/merely-made/dramatis.git"
branch = "main"

[workspace.dependencies.proofs]
package = "mere-proofs"
version = "0.1.0"
path = "crates/proofs"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

[patch."https://github.com/merely-made/eidetic.git".muniment]
path = "crates/muniment"

[patch."https://github.com/merely-made/eidetic.git".chartulary]
path = "crates/chartulary"

[patch."https://github.com/merely-made/eidetic.git".eidetic]
path = "crates/eidetic-core"

[patch."https://github.com/merely-made/eidetic.git".hagiograph]
path = "crates/hagiograph"

[patch."https://github.com/merely-made/eidetic.git".stickleback]
path = "crates/stickleback"

[patch."https://github.com/merely-made/eidetic.git".luggage]
path = "crates/luggage"

[patch."https://github.com/merely-made/eidetic.git".mere-proofs]
path = "crates/proofs"

[patch."https://github.com/merely-made/eidetic.git".servitor]
path = "crates/servitor"

[patch."https://github.com/merely-made/mere.git".muniment]
path = "crates/muniment"

[patch."https://github.com/merely-made/mere.git".chartulary]
path = "crates/chartulary"

[patch."https://github.com/merely-made/mere.git".eidetic]
path = "crates/eidetic-core"

[patch."https://github.com/merely-made/mere.git".hagiograph]
path = "crates/hagiograph"

[patch."https://github.com/merely-made/mere.git".stickleback]
path = "crates/stickleback"

[patch."https://github.com/merely-made/mere.git".luggage]
path = "crates/luggage"

[patch."https://github.com/merely-made/mere.git".mere-proofs]
path = "crates/proofs"

[patch."https://github.com/merely-made/mere.git".servitor]
path = "crates/servitor"

[patch.crates-io.mere-p2panda-net]
git = "https://github.com/mark-ik/p2panda.git"
tag = "mere-p2panda-net-0.7.5-upstream-20261013"

[patch.crates-io.p2panda-auth]
