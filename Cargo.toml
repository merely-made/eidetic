[workspace]
resolver = "2"
exclude = ["support/patches/fjall", "support/patches/lsm-tree"]
members = [
    "crates/muniment",
    "crates/portolan",
    "crates/hodograph",
    "crates/quadstore",
    "crates/fieldbook",
    "crates/eidetic-core",
    "crates/eidetic-search",
    "crates/hagiograph",
    "crates/stickleback",
    "crates/luggage",
    "crates/proofs",
    "crates/servitor",
    "crates/impresa",
    "crates/state-witness",
    "crates/framing",
    # Revision-bound UTF-8 edit proposals, from Mere (engine split D40).
    "crates/source-edit",
]

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/eidetic"
authors = [
    "Mark AB (markik)",
]

[workspace.dependencies.muniment]
version = "0.2.1"
path = "crates/muniment"
default-features = false

[workspace.dependencies.identity]
package = "personae"
version = "0.3.0"
git = "https://github.com/merely-made/dramatis.git"
branch = "main"

[workspace.dependencies.portolan]
version = "0.1.0"
path = "crates/portolan"

[workspace.dependencies.hodograph]
version = "0.1.0"
path = "crates/hodograph"

[workspace.dependencies.quadstore]
version = "0.1.0"
path = "crates/quadstore"

[workspace.dependencies.fieldbook]
version = "0.1.0"
path = "crates/fieldbook"

[workspace.dependencies.eidetic]
version = "0.0.3"
path = "crates/eidetic-core"
default-features = false

[workspace.dependencies.genet-text]
version = "0.1.0"
git = "https://github.com/merely-made/genet.git"
# Match the existing family source identity; Cargo.lock fixes the revision.
branch = "main"

[workspace.dependencies.transport]
package = "mere-transport"
version = "0.0.2"
git = "https://github.com/merely-made/murm.git"
branch = "main"

[workspace.dependencies.serde]
version = "1"
features = [
    "derive",
]

[workspace.dependencies.insigne]
version = "0.0.2"
git = "https://github.com/merely-made/dramatis.git"
branch = "main"

[workspace.dependencies.framing]
package = "mere-framing"
version = "0.0.2"
path = "crates/framing"

[workspace.dependencies.serde_json]
version = "1"

[workspace.dependencies.proofs]
package = "mere-proofs"
version = "0.1.0"
path = "crates/proofs"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[patch."https://github.com/merely-made/eidetic.git".muniment]
path = "crates/muniment"

[patch."https://github.com/merely-made/eidetic.git".portolan]
path = "crates/portolan"

[patch."https://github.com/merely-made/eidetic.git".hodograph]
path = "crates/hodograph"

[patch."https://github.com/merely-made/eidetic.git".quadstore]
path = "crates/quadstore"

[patch."https://github.com/merely-made/eidetic.git".fieldbook]
path = "crates/fieldbook"

[patch."https://github.com/merely-made/eidetic.git".eidetic]
path = "crates/eidetic-core"

[patch."https://github.com/merely-made/eidetic.git".hagiograph]
path = "crates/hagiograph"

[patch."https://github.com/merely-made/eidetic.git".stickleback]
path = "crates/stickleback"

[patch."https://github.com/merely-made/eidetic.git".luggage]
path = "crates/luggage"

[patch."https://github.com/merely-made/eidetic.git".mere-proofs]
path = "crates/proofs"

[patch."https://github.com/merely-made/eidetic.git".servitor]
path = "crates/servitor"

[patch."https://github.com/merely-made/mere.git".muniment]
path = "crates/muniment"

[patch."https://github.com/merely-made/mere.git".eidetic]
path = "crates/eidetic-core"

[patch."https://github.com/merely-made/mere.git".hagiograph]
path = "crates/hagiograph"

[patch."https://github.com/merely-made/mere.git".stickleback]
